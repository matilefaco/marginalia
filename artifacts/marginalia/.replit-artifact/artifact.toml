kind = "web"
previewPath = "/"
title = "Marginalia"
version = "1.0.0"
id = "artifacts/marginalia"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22711

[services.development]
run = "pnpm --filter @workspace/marginalia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marginalia", "run", "build" ]
publicDir = "artifacts/marginalia/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22711"
BASE_PATH = "/"
